<!DOCTYPE html>
<html lang="en">

  <head>
    <meta charset="UTF-8">
    <title>Solska Cuci Sepatu | Splash Animation</title>
    <link rel="stylesheet" href="https://public.codepenassets.com/css/normalize-5.0.0.min.css">
    <link rel='stylesheet' href='https://unpkg.com/splitting@1.0.6/dist/splitting.css'>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Heebo:wght@900&family=Poppins:wght@300;600&display=swap");

      :root {
        --duration: 6s;
        --wave-duration: calc(var(--duration) * 0.25);
        --text-in-delay: calc(var(--duration) * 0.275);
        --text-in-duration: calc(var(--duration) * 0.1);
        --easing: cubic-bezier(0.5, 0, 0.5, 1);
        
        /* Tema Warna Solska: Kuning, Hitam, Putih */
        --dot-color: #FFD500;        /* Kuning cerah */
        --dot-color-dark: #1a1a1a;   /* Kuning gelap/Hitam untuk kedalaman air */
        --text-glow: rgba(255, 213, 0, 0.4);
      }

      *,
      *:before,
      *:after {
        box-sizing: border-box;
        position: relative;
      }

      html,
      body {
        height: 100%;
        width: 100%;
        margin: 0;
        padding: 0;
        /* Background hitam pekat untuk kesan clean dan kontras */
        background: #050505;
        color: #ffffff;
        font-family: "Heebo", sans-serif;
        overflow: hidden;
      }

      body {
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
      }

      .container {
        display: grid;
        align-items: center;
        justify-items: center;
      }
      .container > * {
        grid-area: 1/1;
      }

      .title {
        font-size: 12vmin;
        margin: 0;
        text-transform: uppercase;
        color: #ffffff;
        text-shadow: 0 0 15px var(--text-glow);
      }

      .title .char {
        --delay: calc(var(--text-in-delay) + (0.25s * (1 - var(--distance-percent))));
        -webkit-animation: text-in var(--text-in-duration) var(--easing) var(--delay) backwards;
                animation: text-in var(--text-in-duration) var(--easing) var(--delay) backwards;
        transform-origin: center 1em;
      }
      @-webkit-keyframes text-in {
        0% { opacity: 0; transform: translateX(calc(-0.4em * var(--char-offset))) scale(0); }
        90% { transform: translateX(0em) scale(1.1); }
      }
      @keyframes text-in {
        0% { opacity: 0; transform: translateX(calc(-0.4em * var(--char-offset))) scale(0); }
        90% { transform: translateX(0em) scale(1.1); }
      }
      
      /* Menyesuaikan huruf yang akan di-squish (huruf 'o' dan 'a' pada Solska) */
      .title .char[data-char=o], .title .char[data-char=a] { 
        visibility: hidden;
        --squish-scale: 0.6;
        --squish-y: 10%;
      }
      .title .char[data-char=o]:before, .title .char[data-char=a]:before {
        -webkit-animation: text-squish var(--duration) var(--easing) forwards;
                animation: text-squish var(--duration) var(--easing) forwards;
        visibility: visible;
        transform-origin: center 1em;
      }
      .title .char[data-char=a] {
        --squish-scale: 0.9;
        --squish-y: 5%;
      }
      @-webkit-keyframes text-squish {
        47.5%, 52.5% { transform: none; }
        50% { transform: translateY(calc(var(--squish-y) * 1)) scaleY(calc(var(--squish-scale) * 1)); }
      }
      @keyframes text-squish {
        47.5%, 52.5% { transform: none; }
        50% { transform: translateY(calc(var(--squish-y) * 1)) scaleY(calc(var(--squish-scale) * 1)); }
      }
      .title .char:last-child {
        -webkit-animation: text-in var(--text-in-duration) var(--easing) var(--delay) backwards, text-bonk var(--duration) var(--easing) forwards;
                animation: text-in var(--text-in-duration) var(--easing) var(--delay) backwards, text-bonk var(--duration) var(--easing) forwards;
      }
      @-webkit-keyframes text-bonk {
        80%, 85%, to { transform: none; }
        82% { transform: translateX(-20%); }
      }
      @keyframes text-bonk {
        80%, 85%, to { transform: none; }
        82% { transform: translateX(-20%); }
      }

      /* Subtitle */
      .subtitle {
        font-family: 'Poppins', sans-serif;
        font-weight: 600; /* Sedikit lebih tebal agar terlihat clean */
        font-size: 2.5vmin;
        letter-spacing: 1.5vmin;
        text-transform: uppercase;
        color: var(--dot-color); /* Warna kuning */
        margin-top: 8vmin;
        opacity: 0;
      }

      .dot {
        font-size: 5vmin;
        width: 1em;
        height: 1em;
        -webkit-animation: dot var(--duration) var(--easing) both;
                animation: dot var(--duration) var(--easing) both;
      }

      .dot-inner {
        -webkit-animation: dot-inner var(--duration) var(--easing) both;
                animation: dot-inner var(--duration) var(--easing) both;
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        border-radius: 50%;
        overflow: hidden;
        display: grid;
        align-items: center;
        justify-items: center;
        box-shadow: 0 0 25px var(--text-glow); /* Glow kuning */
      }
      .dot-inner > * {
        grid-area: 1/1;
      }

      .dot-wave {
        width: 200%;
        height: 200%;
        fill: var(--dot-color); /* Air sabun berwarna kuning */
        -webkit-animation: wave-in var(--wave-duration) var(--easing);
                animation: wave-in var(--wave-duration) var(--easing);
        --offset-x: -110%;
      }
      @-webkit-keyframes wave-in {
        0% { transform: translateY(100%) translateX(var(--offset-x)); }
        70% { transform: translateY(30%) translateX(0%); }
      }
      @keyframes wave-in {
        0% { transform: translateY(100%) translateX(var(--offset-x)); }
        70% { transform: translateY(30%) translateX(0%); }
      }
      .dot-wave.background {
        fill: var(--dot-color-dark); /* Bayangan air kuning gelap/kehitaman */
        -webkit-animation-duration: calc(0.95 * var(--wave-duration));
                animation-duration: calc(0.95 * var(--wave-duration));
        --offset-x: 110%;
      }

      @-webkit-keyframes dot {
        from { opacity: 0; transform: scale(3); }
        10% { opacity: 1; transform: scale(3); }
        15% { transform: scale(3) translateY(0.5em) scaleY(1.5); }
        20% { transform: scale(1) translateY(-300%); }
        30% { transform: translateY(1em) scaleY(0.5); }
        40% { transform: translateY(-400%); }
        50% { transform: translateY(-1em); }
        53% { transform: translateY(-300%); }
        56% { transform: translateY(-1em); }
        59% { transform: translateY(-200%); }
        62% { transform: translateY(1em); }
        80%, 90%, to { transform: translateY(1em); }
      }
      @keyframes dot {
        from { opacity: 0; transform: scale(3); }
        10% { opacity: 1; transform: scale(3); }
        15% { transform: scale(3) translateY(0.5em) scaleY(1.5); }
        20% { transform: scale(1) translateY(-300%); }
        30% { transform: translateY(1em) scaleY(0.5); }
        40% { transform: translateY(-400%); }
        50% { transform: translateY(-1em); }
        53% { transform: translateY(-300%); }
        56% { transform: translateY(-1em); }
        59% { transform: translateY(-200%); }
        62% { transform: translateY(1em); }
        80%, 90%, to { transform: translateY(1em); }
      }
      @-webkit-keyframes dot-inner {
        from, 45% { transform: none; }
        70% { transform: translateX(6em); -webkit-animation-timing-function: cubic-bezier(0.5, 0, 1, 0); animation-timing-function: cubic-bezier(0.5, 0, 1, 0); }
        80% { transform: translateX(4.3em); -webkit-animation-timing-function: var(--easing); animation-timing-function: var(--easing); }
        83%, to { transform: translateX(4.4em); }
      }
      @keyframes dot-inner {
        from, 45% { transform: none; }
        70% { transform: translateX(6em); -webkit-animation-timing-function: cubic-bezier(0.5, 0, 1, 0); animation-timing-function: cubic-bezier(0.5, 0, 1, 0); }
        80% { transform: translateX(4.3em); -webkit-animation-timing-function: var(--easing); animation-timing-function: var(--easing); }
        83%, to { transform: translateX(4.4em); }
      }
      
      /* Container Gelembung Sabun */
      .bubbles-container {
        position: absolute;
        bottom: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        z-index: 10;
      }
      .bubble {
        position: absolute;
        bottom: -20px;
        /* Gelembung warna putih bersih agar sesuai tema clean */
        background: radial-gradient(circle at 30% 30%, rgba(255, 255, 255, 0.9), rgba(255, 255, 255, 0.1));
        border-radius: 50%;
        opacity: 0;
        border: 1px solid rgba(255, 255, 255, 0.4);
      }

      /* Small helper to keep animation in sync */
      body:not([data-play]) *,
      body:not([data-play]) *:before,
      body:not([data-play]) *:after {
        visibility: hidden;
        -webkit-animation: none !important;
                animation: none !important;
      }
    </style>
  </head>
    
  <body>
    <div class="container">
      <h1 class="title" data-splitting>•Solska</h1>

      <div class="dot">
        <div class="dot-inner">
          <svg class="dot-wave background" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800">
            <path d="M799.09 90s11.04 0 0 0c-80.714 0-79.621-90-200-90-120.377 0-118.607 90-200 90-81.391 0-81.215-90-200-90C80.308 0 78.68 89.29-.91 90c-6.946.062 0 0 0 0v510h800V90z" />
          </svg>
          <svg class="dot-wave foreground" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800">
            <path d="M799.09 90s11.04 0 0 0c-80.714 0-79.621-90-200-90-120.377 0-118.607 90-200 90-81.391 0-81.215-90-200-90C80.308 0 78.68 89.29-.91 90c-6.946.062 0 0 0 0v510h800V90z" />
          </svg>
        </div>
      </div>
    </div>

    <!-- Subtitle -->
    <h2 class="subtitle">Cuci Sepatu</h2>

    <!-- Container untuk efek gelembung anime.js -->
    <div class="bubbles-container" id="bubbles"></div>

    <script src='https://unpkg.com/splitting@1.0.6/dist/splitting.js'></script>
    <script src='https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.1/anime.min.js'></script>
    
    <script>
      console.clear();
      Splitting();

      // Fungsi untuk mengarahkan ke home.html
      function redirectToHome() {
        window.location.href = 'home.html';
      }

      // Set timer sesuai durasi animasi (7.5 detik)
      let redirectTimer = setTimeout(redirectToHome, 7500);

      // Buat Gelembung Sabun secara dinamis
      const bubblesContainer = document.getElementById('bubbles');
      for(let i = 0; i < 25; i++) {
        let bubble = document.createElement('div');
        bubble.classList.add('bubble');
        let size = anime.random(10, 40);
        bubble.style.width = size + 'px';
        bubble.style.height = size + 'px';
        bubble.style.left = anime.random(10, 90) + '%';
        bubblesContainer.appendChild(bubble);
      }

      // Animasi Gelembung naik ke atas menggunakan anime.js
      function playBubbles() {
        anime({
          targets: '.bubble',
          translateY: [
            { value: 0, duration: 0 },
            { value: -window.innerHeight - 100, duration: anime.random(3000, 6000) }
          ],
          translateX: [
            { value: 0, duration: 0 },
            { value: anime.random(-80, 80), duration: anime.random(2000, 4000) },
            { value: 0, duration: anime.random(2000, 4000) }
          ],
          opacity: [
            { value: 0, duration: 0 },
            { value: 0.8, duration: 500, delay: anime.random(0, 2000) },
            { value: 0, duration: 1000 }
          ],
          scale: [
            { value: 0.5, duration: 0 },
            { value: 1, duration: 1000 },
            { value: 0.8, duration: 2000 }
          ],
          rotate: anime.random(-180, 180),
          easing: 'easeInOutQuad',
          delay: anime.stagger(150, {start: 1000}),
          complete: playBubbles
        });
      }

      // Animasi Subtitle "Cuci Sepatu" muncul
      anime({
        targets: '.subtitle',
        opacity: [0, 1],
        translateY: [20, 0],
        duration: 1500,
        delay: 4500,
        easing: 'easeOutExpo'
      });

      // Jalankan animasi gelembung
      playBubbles();

      // Replay animation by hiding & showing the element again
      let el = document.body;
      el.addEventListener("click", function (e) {
        clearTimeout(redirectTimer);
        
        el.hidden = true;
        requestAnimationFrame(() => {
          el.hidden = false;
          
          redirectTimer = setTimeout(redirectToHome, 7500);

          // Reset animasi subtitle
          anime({
            targets: '.subtitle',
            opacity: 0,
            duration: 0
          });
          
          // Putar ulang subtitle
          anime({
            targets: '.subtitle',
            opacity: [0, 1],
            translateY: [20, 0],
            duration: 1500,
            delay: 4500,
            easing: 'easeOutExpo'
          });
        });
      });

      // Small helper to make sure the animation stays in sync.
      requestAnimationFrame(() => {
        document.body.dataset.play = true;
      });
    </script>
  </body>
  
</html>
